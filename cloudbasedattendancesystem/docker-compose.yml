version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - SECRET_KEY=docker-compose-dev-secret-key-32bytes-min
      - JWT_SECRET_KEY=docker-compose-dev-jwt-key-32bytes-min
      - MONGODB_URI=mongodb://mongo:27017/cloud_attendance
      - MONGODB_DATABASE=cloud_attendance
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: attendance_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
